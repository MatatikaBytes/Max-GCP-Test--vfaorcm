version: 1
default_environment: dev
project_id: 019fd5d2-f698-7fea-85b0-6fe9c86bf536
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-govuk-weekly-road-fuel-prices
    variant: matatika
    pip_url: git+https://github.com/Matatika/tap-spreadsheets-anywhere.git@v0.5.3
  - name: tap-salesforce
    variant: matatika
    pip_url: git+https://github.com/Matatika/tap-salesforce.git@v1.5.3
  - name: tap-mssql
    variant: matatika
    pip_url: git+https://github.com/Matatika/pipelinewise-tap-mssql.git@v1.0.3
  - name: tap-rest-api-msdk
    variant: widen
    pip_url: tap-rest-api-msdk
  - name: tap-hubspot
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-hubspot.git@v0.9.1
  - name: tap-facebook
    variant: matatika
    pip_url: git+https://github.com/Matatika/tap-facebook.git@v0.5.0
  - name: tap-facebook-systemtoken
    variant: matatika
    pip_url: git+https://github.com/Matatika/tap-facebook.git
