    pip_url: git+https://github.com/Matatika/analyze-dbt-models@v0.4.0
    requires:
      transformers:
      - name: dbt
        variant: dbt-labs
      utilities:
      - name: dbt-artifacts
        variant: matatika
      - name: matatika
        variant: matatika
