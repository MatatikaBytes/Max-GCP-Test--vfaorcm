  - name: matatika
    variant: matatika
    pip_url: matatika~=1.17.1
    lock: true
  - name: dbt-artifacts
    variant: matatika
    pip_url: git+https://github.com/Matatika/dbt-artifacts-ext.git@v0.1.0
    lock: true
include_paths:
- extractors/*.yml
